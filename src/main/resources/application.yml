spring:
  application:
    name: certimate-manager-backend
  profiles:
    active: local
  # 프로젝트 루트의 .env 파일(커밋 금지)을 property로 읽어들여 ${DB_URL} 등에서 사용할 수 있게 한다.
  config:
    import: optional:file:.env[.properties]
  # 세 프로필 모두 같은 AWS 공유 DB를 쓰므로 여기 한 곳에만 둔다.
  # 폴백값 없음 = .env가 없으면 기동 실패(비밀번호가 커밋되는 일 방지).
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:}

# AI 해설 생성 (Google Gemini 무료 티어). 키가 없으면 해설 생성만 실패하고 나머지는 정상.
gemini:
  api-key: ${GEMINI_API_KEY:}
  # 무료 티어. 한도가 부족하면 gemini-3.6-flash-lite(RPD 더 넉넉)로 변경 가능.
  model: ${GEMINI_MODEL:gemini-3.6-flash}

# 공유 DB라 어느 프로필도 스키마를 건드리지 않는다(ddl-auto: validate).
# 스키마 변경은 SQL로 직접 적용할 것 — update로 되돌리면 대소문자 중복 테이블이 다시 생긴다.
---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.hibernate.SQL: debug

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
