spring:
  application:
    name: certimate-manager-backend
  profiles:
    active: local
  # 프로젝트 루트의 .env 파일(커밋 금지)을 property로 읽어들여 ${DB_URL} 등에서 사용할 수 있게 한다.
  config:
    import: optional:file:.env[.properties]

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForCertiMateProject2026!}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  redirect-uri: ${KAKAO_REDIRECT_URI:}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:}

# AI 해설 생성 (Anthropic Claude). 키가 없으면 해설 생성만 실패하고 나머지는 정상.
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-5}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/certimate_manager?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.hibernate.SQL: debug

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
